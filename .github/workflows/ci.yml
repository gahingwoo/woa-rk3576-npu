name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a runner-image refresh cannot silently change the headers the
  # driver is checked against (same pin and runner as woa-rk3576's ci.yml).
  WDK_VERSION: '10.0.26100.0'
  # charsiu for Windows on Arm is built with llvm-mingw (clang, UCRT); pinned
  # by release and by the digest GitHub publishes for the asset.
  LLVM_MINGW_TAG: '20261020'
  LLVM_MINGW_SHA256: '55064b60b991a1e1e8090b8c2f84e82b22cfe5903d12c159d65064cf5e8ae335'

jobs:
  host:
    name: Interface and tool (Linux, gcc)
    # The IOCTL header and rknputest are plain C. The selftest checks the
    # structure sizes and the READ_REGS range rule without a device.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true      # external/charsiu, for tools/m3gen
      - name: Build and self-test
        run: |
          set -eux
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -O2 -Wall -Wextra -Werror -pedantic \
              -Iinclude -o rknputest tools/rknputest/main.c
          ./rknputest selftest
          # m3 against the in-memory stand-in for the driver: the tool's
          # buffers, relocations and checks, not the NPU
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -O2 -Wall -Wextra -Werror -pedantic \
              -Iinclude -DRKNPU_FAKE_DEVICE -o rknputest-fake \
              tools/rknputest/main.c tools/rknputest/fakedev.c -lpthread
          ./rknputest-fake m3 --iters 2 --map
          # M6: scatter, ladder and latency against the stand-in (no MMU there)
          # and two handles on two threads at once, each with its own
          # buffers, whose jobs overlap: the case the first M6 board run
          # failed (a second handle's WRITE_BO refused as busy)
          ./rknputest-fake m6 --iters 8 --mb 128
          # M8: the SUBMIT phase counters answer
          ./rknputest-fake submit-stats --reset | grep -q "the sums are zero again"
          # the test must catch the old device-wide rule
          if FAKE_GLOBAL_BUSY=1 ./rknputest-fake m6 --iters 8 --mb 0 > old-rule.txt 2>&1; then
            cat old-rule.txt; echo "the parallel test passed under the old rule"; exit 1
          fi
          grep -q "WRITE_BO refused, busy\|MAP_BO refused, busy" old-rule.txt
          # the shared CBUF (second M6 board run): core c uses window c and
          # both cores overlap; with --collide (both on window 0) the driver
          # must make the jobs wait for each other and stay exact ...
          ./rknputest-fake m6 --iters 8 --mb 0 --collide | tee collide.txt
          grep -q "RKNPU M6: PASS" collide.txt
          waits=$(grep "^core . totals" collide.txt | sed 's/.* \([0-9]*\) CBUF waits.*/\1/' | paste -sd+ | bc)
          test "$waits" -gt 0
          # ... and without that wait the model corrupts both, as the board did
          if FAKE_NO_CBUF_GUARD=1 ./rknputest-fake m6 --iters 8 --mb 0 --collide > noguard.txt 2>&1; then
            cat noguard.txt; echo "same-window jobs ran together and the test did not notice"; exit 1
          fi
          grep -q "words wrong" noguard.txt
      - name: M3 streams and packing against charsiu
        run: |
          set -eux
          # the captured streams must be what charsiu emits today, and the
          # packing in m3_gemm.h byte-identical to charsiu's
          make -C tools/m3gen header
          git diff --exit-code tools/rknputest/m3_streams.h
          # M4: the register list SUBMIT enforces is every register charsiu
          # writes, regenerated from charsiu on every push
          make -C tools/m3gen regs
          git diff --exit-code include/rknpu_regcmd_allow.h
          make -C tools/m3gen check
          # the headers alone, freestanding, as the driver and port/ see them
          printf '#include "rknpu_ioctl.h"\n#include "rknpu_regcmd.h"\n' > hdr.c
          gcc -std=c99 -ffreestanding -nostdinc -Wall -Wextra -Werror -Iinclude -c hdr.c -o /dev/null
      - name: Performance counters (manifest and values)
        run: |
          set -eux
          # rknpu.man against the structures the driver fills, and the
          # tick conversion the counter callback uses
          python3 tools/perfcheck/check_manifest.py drivers/rknpu/rknpu.man \
              drivers/rknpu/rknpu_perf.h tools/rknpu-perfcounters.ps1
          gcc -std=c99 -O2 -Wall -Wextra -Werror -pedantic -Idrivers/rknpu \
              -o perfcheck tools/perfcheck/perfcheck.c
          ./perfcheck
      - name: M4 board scripts parse
        run: |
          set -eux
          shellcheck tools/m4/*.sh
          for f in tools/m4/win-run.ps1 tools/m6/win-bench.ps1 tools/m7/m7-bench.ps1 tools/charsiu-perf/cp-bench.ps1 tools/rknpu-reinstall.ps1 tools/rknpu-perfcounters.ps1 win/charsiu.ps1 win/charsiu-install.ps1; do
            F="$f" pwsh -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($env:F, [ref]$null, [ref]$e); if ($e) { $e; exit 1 }'
          done
      - name: M4 device layer against the in-memory driver
        run: |
          set -eux
          # port/device_rknpu.c on test/xport_fake.c, which runs the driver's
          # own stream check: chunking, the copy arena, busy cores, the job
          # history, and the three refusals; M6 (cached buffers, PREP/FINI)
          # and, with RKNPU_FAKE_M4=1, the same against the M4 driver
          make -C port check
          RKNPU_FAKE_M4=1 port/build/host/devtest
          # M7: the M6 driver (no fused PREP / FINI), the SUBMIT threads,
          # and the maintenance in the process, alone and together
          RKNPU_FAKE_M6=1 port/build/host/devtest
          # M8: the M7 driver (no SUBMIT phases), and M7's SUBMIT checks asked
          # of an M8 driver (and of an M7 one, which must never see the flag)
          RKNPU_FAKE_M7=1 port/build/host/devtest
          CHARSIU_RKNPU_M7SUBMIT=1 port/build/host/devtest
          RKNPU_FAKE_M7=1 CHARSIU_RKNPU_M7SUBMIT=1 port/build/host/devtest
          CHARSIU_RKNPU_FUSE=0 port/build/host/devtest
          CHARSIU_RKNPU_ASYNC=1 port/build/host/devtest
          CHARSIU_RKNPU_ASYNC=1 RKNPU_FAKE_M6=1 port/build/host/devtest
          # user-mode cache maintenance is the default where the probe allows it
          RKNPU_FAKE_UCACHE=1 port/build/host/devtest
          RKNPU_FAKE_UCACHE=1 CHARSIU_RKNPU_UCACHE=0 port/build/host/devtest
          CHARSIU_RKNPU_ASYNC=1 RKNPU_FAKE_UCACHE=1 port/build/host/devtest
      - name: Wording
        run: |
          # No en or em dashes, and the project's wording rule for public files.
          set -u
          bad=0
          if git grep -nP '\x{2013}|\x{2014}' -- . ':!LICENSE'; then bad=1; fi
          if git grep -niE 'reverse[- ]?engineer' -- . ':!.github/workflows/ci.yml'; then bad=1; fi
          exit $bad

  linux-arm64:
    name: Float math against glibc, and the Linux reference build (aarch64)
    # The Windows charsiu carries glibc's expf, sinf, cosf and powf (ARM
    # optimized-routines, port/libm) so its greedy text cannot differ from the
    # Linux run's by a last bit in a softmax. Checked here on every float
    # input, with clang as the Windows build uses, against arm64 glibc.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true      # external/charsiu, for the Linux reference
      - name: Every input
        run: |
          set -eux
          command -v clang || { sudo apt-get update && sudo apt-get install -y clang; }
          clang --version | head -1
          ldd --version | head -1
          make -C port libm-check CC=clang
      - name: Linux reference binaries
        run: |
          set -eux
          # charsiu_run and charsiu_matmul for the board's Armbian, static,
          # from the same charsiu commit, with charsiu's own rocket device.c
          make -C port linux-ref CC=gcc
          file port/build/linux/*
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: charsiu-m4-linux-ref
          path: port/build/linux/charsiu_*
          if-no-files-found: error

  charsiu:
    name: charsiu for Windows on Arm (llvm-mingw)
    needs: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true      # external/charsiu, compiled unchanged
      - name: llvm-mingw
        run: |
          set -eux
          f=llvm-mingw-${LLVM_MINGW_TAG}-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/$f" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/$f"
          echo "${LLVM_MINGW_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/$f"
          echo "LLVM_MINGW=$RUNNER_TEMP/${f%.tar.xz}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -eux
          "$LLVM_MINGW/bin/aarch64-w64-mingw32-clang" --version | head -1
          make -C port win LLVM_MINGW="$LLVM_MINGW"
          for e in port/build/win/*.exe; do
            "$LLVM_MINGW/bin/llvm-objdump" -f "$e" | grep -q 'file format coff-arm64' \
              || { echo "$e is not ARM64"; exit 1; }
            "$LLVM_MINGW/bin/llvm-objdump" -p "$e" | grep 'DLL Name'
          done
      - uses: actions/download-artifact@v4
        with:
          name: charsiu-m4-linux-ref
          path: ${{ runner.temp }}/charsiu-m7/linux
      - name: Stage
        run: |
          set -eux
          out="$RUNNER_TEMP/charsiu-m7"
          mkdir -p "$out"
          chmod +x "$out"/linux/*
          cp port/build/win/*.exe "$out/"
          cp docs/use.md docs/dev/testing.md docs/dev/performance.md tools/m4/*.ps1 tools/m4/*.sh tools/m6/*.ps1 external/charsiu/tests/corpus/long.txt "$out/"
          cp tools/m7/m7-bench.ps1 tools/charsiu-perf/cp-bench.ps1 "$out/"
          cp LICENSE "$out/LICENSE.txt"
          cp port/libm/LICENSE.optimized-routines "$out/"
          git -C external/charsiu rev-parse HEAD > "$out/charsiu-commit.txt"
          git rev-parse HEAD > "$out/woa-rk3576-npu-commit.txt"
          (cd "$out" && sha256sum ./*.exe linux/* > SHA256SUMS)
          ls -la "$out"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: charsiu-m7-arm64
          path: ${{ runner.temp }}/charsiu-m7
          if-no-files-found: error

      - name: Package (charsiu-windows-arm64.zip, what charsiu-install.ps1 installs)
        run: |
          set -eux
          sh win/mkpkg.sh port/build/win "$RUNNER_TEMP/pkg"
          unzip -l "$RUNNER_TEMP/pkg/charsiu-windows-arm64.zip"
          # the package must be what the installer looks for
          for f in charsiu.ps1 charsiu-install.ps1 charsiu_run.exe charsiu_serve.exe charsiu_check.exe zoo.txt bin/charsiu.cmd config.ini VERSION; do
            unzip -l "$RUNNER_TEMP/pkg/charsiu-windows-arm64.zip" | grep -q " $f\$" || { echo "no $f in the package"; exit 1; }
          done
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: charsiu-windows-arm64
          path: |
            ${{ runner.temp }}/pkg/charsiu-windows-arm64.zip
            ${{ runner.temp }}/pkg/charsiu-windows-arm64.zip.sha256
          if-no-files-found: error

  frontdoor:
    name: charsiu's Windows front door and installer (pwsh on Linux)
    # charsiu.ps1 runs charsiu's own Linux programs under their Windows names,
    # so every path that is not Windows itself is exercised: pull with the
    # sha256 check, the gate, list, rm, a question, the quoting, bench, serve
    # on --port 0 with a client that leaves, and the installer's dry run.
    runs-on: ubuntu-24.04-arm
    env:
      PWSH_VERSION: '7.4.6'
      PWSH_SHA256: 'c0159b03e85f44ae1e7697818a011558da6c813d0aae848bf5ac13bf435d8624'
      MODEL_SHA256: 'bcc3af2849ad6095af57e9b5cd43775256efdc66e306acb529172f92d0c04b03'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: charsiu for Linux (the stand-ins)
        run: |
          set -eux
          make -C external/charsiu build/charsiu_run build/charsiu_check build/charsiu_serve
      - name: pwsh
        run: |
          set -eux
          f=powershell-${PWSH_VERSION}-linux-arm64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/$f"
          echo "${PWSH_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar -C "$RUNNER_TEMP/pwsh" -xzf "$RUNNER_TEMP/$f"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "PWSH=$RUNNER_TEMP/pwsh/pwsh" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/model
          key: smollm2-135m-q4-${{ env.MODEL_SHA256 }}
      - name: The smallest model in the zoo
        run: |
          set -eux
          m="$RUNNER_TEMP/model/SmolLM2-135M-Instruct-Q4_0.gguf"
          if [ ! -f "$m" ]; then
            mkdir -p "$RUNNER_TEMP/model"
            curl -fsSL -o "$m" https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_0.gguf
          fi
          echo "${MODEL_SHA256}  $m" | sha256sum -c -
      - name: The front door
        run: sh win/test/frontdoor.sh external/charsiu/build "$RUNNER_TEMP/model/SmolLM2-135M-Instruct-Q4_0.gguf"

  windows:
    name: WDK build, test-signed (ARM64)
    # windows-2022, as woa-rk3576: windows-latest ships the 26100 SDK but no
    # WDK (no km\wdm.h, no kmdf headers, no inf2cat; run 44956621977).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Check the WDK
        shell: pwsh
        run: |
          # A missing toolchain is a build failure, not something to skip:
          # if the pin is absent, the runner image changed and WDK_VERSION
          # needs a deliberate bump.
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $ver = $env:WDK_VERSION
          Write-Host "--- Include ---"
          Get-ChildItem "$kits\Include" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          $need = @(
            "$kits\Include\$ver\km\wdm.h",
            "$kits\Include\wdf\kmdf\1.33\wdf.h",
            "$kits\Lib\$ver\km\arm64\ntoskrnl.lib",
            "$kits\bin\$ver\x86\inf2cat.exe",
            "$kits\bin\$ver\x86\signtool.exe",
            "$kits\bin\$ver\x64\ctrpp.exe"
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::missing $_" }
            throw "WDK $ver is not fully present on this runner"
          }
          Write-Host "Using WDK $ver."

      - name: Build rknpu.sys and rknputest.exe
        shell: pwsh
        run: |
          foreach ($proj in 'drivers/rknpu/rknpu.vcxproj', 'tools/rknputest/rknputest.vcxproj') {
            Write-Host "== $proj"
            msbuild $proj /p:Configuration=Release /p:Platform=ARM64 `
                    /p:WindowsTargetPlatformVersion=$env:WDK_VERSION `
                    /p:SignMode=Off /m /nologo /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for $proj" }
          }

      - name: Stage and test-sign
        shell: pwsh
        run: |
          # testsigning on the target accepts a signature that does not chain
          # to a trusted root; it does not accept no signature at all
          # (CM_PROB_UNSIGNED_DRIVER, seen on hardware with woa-rk3576). The
          # certificate is made here and thrown away with the runner: trust
          # the signer.cer of the same run, and only that run's package.
          $kits = 'C:\Program Files (x86)\Windows Kits\10'
          $st   = Join-Path $kits "bin\$env:WDK_VERSION\x86\signtool.exe"
          $i2c  = Join-Path $kits "bin\$env:WDK_VERSION\x86\inf2cat.exe"
          $out  = Join-Path $env:RUNNER_TEMP 'rknpu-m7'
          $drv  = Join-Path $out 'rknpu'
          New-Item -ItemType Directory -Force -Path $drv | Out-Null

          # the stamped INF and the .sys from the package directory
          $pkg = 'drivers\rknpu\ARM64\Release\rknpu'
          foreach ($f in 'rknpu.sys', 'rknpu.inf', 'rknpu.man') {
            $p = Join-Path $pkg $f
            if (-not (Test-Path $p)) { throw "missing $p" }
            Copy-Item $p $drv -Force
          }
          Copy-Item drivers\rknpu\ARM64\Release\rknpu.pdb $drv -ErrorAction SilentlyContinue
          $exe = 'tools\rknputest\ARM64\Release\rknputest.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          Copy-Item $exe $out -Force

          $pfxPw = 'rknpu-test'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
                    -Subject 'CN=woa-rk3576-npu test signing' `
                    -CertStoreLocation Cert:\CurrentUser\My `
                    -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(5)
          $pfx = Join-Path $env:RUNNER_TEMP 'rknpu-test.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString $pfxPw -Force -AsPlainText) | Out-Null

          & $st sign /fd sha256 /f $pfx /p $pfxPw (Join-Path $drv 'rknpu.sys')
          if ($LASTEXITCODE) { throw "signtool failed for rknpu.sys" }
          # 10_RS3_ARM64 is build 16299, the floor of the INF's decoration.
          & $i2c /driver:"$drv" /os:10_RS3_ARM64 /verbose
          if ($LASTEXITCODE) { throw "inf2cat failed: $LASTEXITCODE" }
          $files = @((Join-Path $drv 'rknpu.cat'), (Join-Path $out 'rknputest.exe'))
          & $st sign /fd sha256 /f $pfx /p $pfxPw $files
          if ($LASTEXITCODE) { throw "signtool failed: $LASTEXITCODE" }
          Remove-Item $pfx -Force

          # A signature is present; whether it chains to a root is the
          # question a self-signed certificate fails by design.
          $all = @((Join-Path $drv 'rknpu.sys')) + $files
          foreach ($sig in Get-AuthenticodeSignature -FilePath $all) {
            $who = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '<none>' }
            Write-Host ("   {0,-14} {1}  {2}" -f $sig.Status, (Split-Path $sig.Path -Leaf), $who)
            if ($sig.Status -eq 'NotSigned') { throw "$($sig.Path) came out unsigned" }
          }
          Export-Certificate -Cert $cert -FilePath (Join-Path $out 'signer.cer') | Out-Null
          Copy-Item docs\use.md, docs\dev\testing.md, docs\dev\perfcounters.md, tools\rknpu-reinstall.ps1, tools\rknpu-perfcounters.ps1 $out -Force
          # the counter names went into rknpu.sys, and the package's version
          $sys = [System.IO.File]::ReadAllBytes((Join-Path $drv 'rknpu.sys'))
          $txt = [System.Text.Encoding]::Unicode.GetString($sys)
          if (-not $txt.Contains('RK3576 NPU')) { throw 'rknpu.sys carries no counter names (rknpuCounters.rc not linked)' }
          $dv = Select-String -Path (Join-Path $drv 'rknpu.inf') -Pattern '^DriverVer' | Select-Object -First 1
          Write-Host "::notice::rknpu $($dv.Line)"
          $dv.Line | Out-File -FilePath (Join-Path $out 'DriverVer.txt') -Encoding ascii
          Get-ChildItem $out -Recurse -File | Select-Object FullName, Length |
            Format-Table -AutoSize | Out-String | Write-Host
          "STAGE=$out" >> $env:GITHUB_ENV

          # rknpu-windows-arm64.zip: what charsiu-install.ps1 --driver stages
          $z = Join-Path $env:RUNNER_TEMP 'rknpu-windows-arm64.zip'
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $z -Force
          $h = (Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  rknpu-windows-arm64.zip" | Out-File -FilePath "$z.sha256" -Encoding ascii
          Write-Host "rknpu-windows-arm64.zip $h"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rknpu-m7-arm64
          path: ${{ env.STAGE }}
          if-no-files-found: error

      - name: Upload the driver package
        uses: actions/upload-artifact@v4
        with:
          name: rknpu-windows-arm64
          path: |
            ${{ runner.temp }}/rknpu-windows-arm64.zip
            ${{ runner.temp }}/rknpu-windows-arm64.zip.sha256
          if-no-files-found: error

  release:
    name: Attach the packages to a release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [charsiu, frontdoor, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: charsiu-windows-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rknpu-windows-arm64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
