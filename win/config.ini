# %LOCALAPPDATA%\charsiu\config.ini: what `charsiu` runs on Windows, and how.
#
# The same file as charsiu's etc/config.ini on Linux, with the same keys; the
# differences are said where they are. Hand-editable: `charsiu pull` and
# `charsiu setup` change values in place and leave comments alone.

[model]
# The gguf to run. `charsiu pull` fetches one and records it here.
path =

[run]
threads = 4
context = 512
# Which cores. Left unset on Windows: the port answers charsiu's cluster
# probe from what Windows knows about each processor and pins the decode
# thread to the fast cores itself (docs/M7.md). A list such as 4-7 here pins
# it by number instead.
# cpus = 4-7
#
# THE WEIGHT CACHE IS ON BY DEFAULT HERE, and off on Linux. On Windows the
# NPU weights take about a minute to quantise at every start and five
# seconds to read back from MODEL.gguf.wcache (docs/M7.md: 77 s -> 5 s). It
# costs a file about the size of the quantised model beside the model.
cache = yes

[serve]
# `charsiu serve` holds whole conversations, so it gets more room than a
# question asked once.
context = 2048

[npu]
enable = yes
kslice = 1024
maxn = 262144
coef_elems = 65536

[debug]
enable = no

[extra]
# Raw CHARSIU_* passthrough, one NAME=VALUE per line.
